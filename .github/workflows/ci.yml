name: CI

on:
  push:
    branches: [main]
  # No base-branch filter: stacked PRs (based on another PR's branch)
  # must get CI feedback during review too.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: xcode-27
    permissions:
      contents: read
      id-token: write  # Codecov upload via GitHub OIDC (no static token)
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Cache SwiftPM build directory
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-debug-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-debug-${{ runner.os }}-

      - name: Test
        run: swift test --enable-code-coverage

      # SwiftPM builds one .xctest bundle per test target (not a single
      # <Package>PackageTests.xctest), so pass every bundle's binary to llvm-cov.
      - name: Export coverage (lcov)
        run: |
          BIN_PATH=$(swift build --show-bin-path)
          objects=()
          for bundle in "$BIN_PATH"/*.xctest; do
            objects+=(-object "$bundle/Contents/MacOS/$(basename "$bundle" .xctest)")
          done
          xcrun llvm-cov export -format=lcov \
            -instr-profile "$BIN_PATH/codecov/default.profdata" \
            -ignore-filename-regex="\.build|Tests" \
            "${objects[@]}" \
            > coverage.lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.lcov
          use_oidc: true
          fail_ci_if_error: false

  # Catches release-only compile issues (optimization, inlining) in a
  # parallel job, so the test job doesn't build everything twice.
  release-build:
    name: Release Build
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Cache SwiftPM build directory
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-release-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-release-${{ runner.os }}-

      - name: Build
        run: swift build -c release

  # Package.swift omits the SwiftUI-based TortoiseUI product/targets on Linux,
  # so plain `swift test` covers TortoiseCore + TortoiseSVG here.
  linux:
    name: Linux (Core + SVG)
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v7

      - name: Cache SwiftPM build directory
        uses: actions/cache@v6
        with:
          path: .build
          key: spm-linux-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-linux-

      - name: Test
        run: swift test

  format-lint:
    name: swift-format lint
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        uses: ./.github/actions/select-xcode

      - name: Lint
        run: xcrun swift-format lint --recursive --strict Sources Tests
